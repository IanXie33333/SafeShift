[project]
name = "safeshift"
version = "0.1.0"
description = "Workplace injury forecasting and narrative classification"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
